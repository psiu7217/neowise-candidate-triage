<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="result" aria-labelledby="result-title" hidden>
    <h2 id="result-title">Черновик ответа</h2>
    <p>Тема — <strong id="topic"></strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topicLabels = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Стоимость"],
      ["other", "Другое"],
    ]);
    const manualReviewMessage = "Черновик не готов. Разберите заявку вручную.";
    let latestRequestId = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequestId;
      const text = message.value;
      topic.textContent = "";
      draft.textContent = "";
      result.hidden = true;

      if (!text.trim()) {
        status.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const body = await reply.json();
        if (requestId !== latestRequestId) return;

        const topicLabel = topicLabels.get(body?.topic);
        const draftText = typeof body?.draft === "string" ? body.draft.trim() : "";
        if (reply.ok && body?.status === "ready" && topicLabel && draftText) {
          topic.textContent = topicLabel;
          draft.textContent = draftText;
          result.hidden = false;
          status.textContent = "Черновик готов. Проверьте его перед отправкой клиенту.";
        } else if (reply.status === 400 && body?.status === "invalid_input") {
          status.textContent = "Введите текст заявки.";
        } else {
          status.textContent = manualReviewMessage;
        }
      } catch {
        if (requestId === latestRequestId) status.textContent = manualReviewMessage;
      }
    });
  </script>
</body>
</html>
